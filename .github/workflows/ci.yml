name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: install.sh and hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rtk
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/rtk-ai/rtk/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          echo "rtk version: $tag"
          curl -fsSL -o /tmp/rtk.tar.gz \
            "https://github.com/rtk-ai/rtk/releases/download/${tag}/rtk-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/rtk.tar.gz -C /tmp
          sudo install -m 0755 /tmp/rtk /usr/local/bin/rtk
          rtk --version

      - name: Shellcheck
        run: shellcheck install.sh

      - name: Validate JSON files
        run: python3 -m json.tool .devin/hooks.v1.json > /dev/null

      - name: Posthook script compiles
        run: python3 -m py_compile rtk-posthook.py

      - name: Hook rewrites exec commands
        run: |
          set -euo pipefail
          out="$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"exec","tool_input":{"command":"git status","shell_id":"main"}}' \
            | rtk hook claude)"
          echo "$out"
          echo "$out" | grep -q '"command":"rtk git status"'
          echo "$out" | grep -q '"shell_id":"main"'

      - name: Hook rewrites compound commands
        run: |
          set -euo pipefail
          out="$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"exec","tool_input":{"command":"echo hi && git status"}}' \
            | rtk hook claude)"
          echo "$out" | grep -q 'rtk git status'

      - name: Hook passes through non-rewrites
        run: |
          set -euo pipefail
          # already-rewritten command: no output
          test -z "$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"exec","tool_input":{"command":"rtk git status"}}' \
            | rtk hook claude)"
          # non-exec tool: no output
          test -z "$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"read","tool_input":{"file_path":"/tmp/x"}}' \
            | rtk hook claude)"

      - name: install.sh dry run
        run: ./install.sh --dry-run

      - name: install.sh project lifecycle
        run: |
          set -euo pipefail
          mkdir -p /tmp/rtk-ci-proj
          ./install.sh --project /tmp/rtk-ci-proj
          python3 -m json.tool /tmp/rtk-ci-proj/.devin/hooks.v1.json > /dev/null
          # project installs manage the user-level rtk pipeline.toml
          RTK_CFG_DIR="$(rtk config | sed -n 's/^Config: //p' | head -1 | xargs dirname)"
          grep -q 'rtk:posthook' "$RTK_CFG_DIR/pipeline.toml"
          ./install.sh --project /tmp/rtk-ci-proj
          ./install.sh --uninstall --project /tmp/rtk-ci-proj
          test ! -f /tmp/rtk-ci-proj/.devin/hooks.v1.json
          # no global Devin config on the runner, so pipeline.toml is removed too
          test ! -f "$RTK_CFG_DIR/pipeline.toml"

      - name: PostToolUse hook compresses exec output
        run: |
          set -euo pipefail
          mkdir -p /tmp/rtk-ci-proj
          ./install.sh --project /tmp/rtk-ci-proj >/dev/null
          SCRIPT="$HOME/.local/share/rtk-devin/rtk-posthook.py"
          test -f "$SCRIPT"
          python3 - <<'PY'
          import json
          lines = ["Output from command in shell ci:"]
          lines += ["line %04d repeated payload content for compression" % i for i in range(400)]
          lines += ["", "", "Exit code: 0"]
          payload = {"hook_event_name": "PostToolUse", "tool_name": "exec",
                     "tool_input": {"command": "verbose-build"},
                     "tool_response": {"success": True, "output": "\n".join(lines), "error": None}}
          open("/tmp/posthook-in.json", "w").write(json.dumps(payload))
          PY
          out="$(python3 "$SCRIPT" < /tmp/posthook-in.json)"
          echo "$out" | grep -q 'updatedToolOutput'
          # passthrough cases must stay silent
          small='{"hook_event_name":"PostToolUse","tool_name":"exec","tool_input":{"command":"echo hi"},"tool_response":{"success":true,"output":"hi","error":null}}'
          test -z "$(printf '%s' "$small" | python3 "$SCRIPT")"
          ./install.sh --uninstall --project /tmp/rtk-ci-proj >/dev/null
